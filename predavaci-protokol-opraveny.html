<!DOCTYPE html>
<html lang="cs"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Předávací protokol TURTO</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#eef0f3;--card:#fff;--tx:#1f2733;--mu:#6b7686;--ln:#cfd5de;--red:#c8222f;--navy:#2b3440;--in:#f6f7f9}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#161a20;--card:#222831;--tx:#e8ecf1;--mu:#98a3b3;--ln:#3a4350;--in:#1a1f26}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 Carlito,Calibri,"Segoe UI",Roboto,sans-serif}
header{background:var(--navy);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
header b{background:var(--red);padding:3px 10px;border-radius:3px;font-size:18px}
nav{display:flex;gap:4px;overflow-x:auto;padding:8px 8px 0;background:var(--bg)}
nav button{flex:1;min-width:92px;padding:12px 8px;border:0;border-bottom:3px solid transparent;background:none;color:var(--mu);font:inherit;font-weight:600}
nav button.on{color:var(--tx);border-color:var(--red)}
main{max-width:860px;margin:0 auto;padding:12px}
.sec{display:none;background:var(--card);border-radius:8px;padding:16px}.sec.on{display:block}
h2{margin:0 0 12px;font-size:20px}h3{margin:18px 0 6px;font-size:17px;color:var(--red)}
label{display:block;font-size:14px;color:var(--mu);margin:10px 0 3px}
input,textarea,select{width:100%;padding:12px;border:1px solid var(--ln);border-radius:6px;background:var(--in);color:var(--tx);font:inherit}
textarea{min-height:90px}.g{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}@media(max-width:600px){.g{grid-template-columns:1fr}}
.opt{display:flex;flex-wrap:wrap;gap:8px}.opt label{display:flex;align-items:center;gap:8px;margin:0;padding:12px 14px;border:1px solid var(--ln);border-radius:6px;color:var(--tx);font-size:16px}
.opt input{width:22px;height:22px;padding:0}
button.b{padding:14px 20px;border:0;border-radius:6px;background:var(--red);color:#fff;font:inherit;font-weight:700}
button.s{background:var(--navy)}button.l{background:none;color:var(--mu);border:1px solid var(--ln)}
.bar{display:flex;gap:10px;justify-content:space-between;margin-top:18px;flex-wrap:wrap}
#res div{padding:12px;border-bottom:1px solid var(--ln);cursor:pointer}#res small{color:var(--mu)}
.it{display:grid;grid-template-columns:34px 1fr 74px 52px 92px;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--ln)}
.it input[type=checkbox]{width:26px;height:26px;padding:0}.it input[type=number]{padding:8px}.it small{display:block;color:var(--mu);font-size:12px}
.it.off .q,.it.off .p{opacity:.35}.tot{font-size:20px;font-weight:700;text-align:right;margin-top:12px}
body.role-prace .it .p{display:none!important}body.role-prace .tot{display:none!important}body.role-prace #jo{display:none!important}body.role-turto [data-ceny="1"]{display:none!important}
@media(max-width:600px){.it{grid-template-columns:30px 1fr 64px 80px}.it .u{display:none}}
.ph{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-top:12px}.ph div{border:1px solid var(--ln);border-radius:6px;padding:8px}.ph img{width:100%;height:130px;object-fit:cover;border-radius:4px}
canvas.sg{width:100%;height:170px;border:1px dashed var(--mu);border-radius:6px;background:#fff;touch-action:none}
#out{margin-top:16px;display:none}#out a,#out button{display:inline-block;margin:4px 6px 4px 0;text-decoration:none}
#stage{position:fixed;left:-9999px;top:0}
.pg{width:794px;height:1123px;background:#fff;color:#222;position:relative;font:12px/1.4 Calibri,"Segoe UI",Arial,sans-serif;overflow:hidden}
.hd{height:90px;background:linear-gradient(180deg,#c8d0d9 0%,#9aa5b0 100%);position:relative;display:flex;align-items:stretch}
.hd-logo{width:110px;display:flex;align-items:center;justify-content:center;padding:8px;background:#fff}
.hd-logo img{width:90px;height:auto}
.hd-title{position:absolute;left:100px;top:50%;transform:translateY(-50%);background:#c8222f;color:#fff;font:700 22px/1.1 Calibri,"Segoe UI",Arial,sans-serif;letter-spacing:2px;padding:9px 20px 9px 16px;box-shadow:inset -4px 0 0 #2b3440}
.hd-right{position:absolute;right:0;top:0;bottom:0;width:28px;background:#c8222f}
.bd{position:absolute;left:40px;right:40px;top:106px;bottom:76px;overflow:hidden}
.pg-subhd{background:#c8222f;color:#fff;font:700 11px/1 Calibri,sans-serif;padding:4px 8px;margin:10px 0 0;letter-spacing:.5px}
.pg h4{margin:12px 0 4px;font-size:13px;font-weight:700;color:#111;border-bottom:1px solid #bbb;padding-bottom:2px}
.pg .r{display:flex;gap:4px;margin:2px 0;font-size:11.5px}.pg .r b{font-weight:400;color:#777;white-space:nowrap;min-width:120px}.pg .r span{flex:1;border-bottom:1px solid #ccc;min-height:15px;padding:0 2px;color:#111}
.pg .two{display:grid;grid-template-columns:1fr 1fr;gap:0 30px}.pg .tx{white-space:pre-wrap;border-bottom:1px solid #ccc;min-height:55px;padding:2px 3px;font-size:11.5px}
.pg .dod-wrap{display:grid;grid-template-columns:1fr 1fr;gap:0 20px;margin-bottom:10px}
.pg .dod-col{border:1px solid #bbb;padding:0}
.pg .dod-hd{font:700 11px/1 Calibri,sans-serif;padding:3px 8px;border-bottom:1px solid #bbb;background:#e8ebee;color:#222;letter-spacing:.3px}
.pg .dod-body{padding:6px 8px;font-size:11px;line-height:1.6;color:#222}
.pg table{width:100%;border-collapse:collapse;font-size:11.5px;margin-top:4px}
.pg thead tr{background:#c8222f;color:#fff}
.pg thead th{padding:4px 6px;text-align:left;font-weight:700;font-size:11px}
.pg thead th.n{text-align:right}
.pg tbody tr{background:#fff}
.pg tbody tr:nth-child(even){background:#f4f4f4}
.pg td{border-bottom:1px solid #ddd;padding:3px 6px;vertical-align:top}
.pg td.n{text-align:right;white-space:nowrap}
.pg tfoot td{border-top:2px solid #c8222f;font-weight:700;padding:4px 6px;background:#fff}
.pg tfoot td.n{text-align:right}
.ft{position:absolute;left:0;right:0;bottom:0;height:68px;border-top:1px solid #ccc;display:flex;font-size:9px;color:#444;padding:6px 0}
.ft-left{width:200px;text-align:right;padding-right:12px;border-right:1.5px solid #c8222f;font-style:italic;line-height:1.5}
.ft-mid{flex:1;padding:0 12px;line-height:1.5}
.ft-right{width:220px;padding-left:12px;border-left:1px solid #ccc;line-height:1.5}
.ft b{font-weight:700;font-style:normal;color:#111}
.pn{position:absolute;right:40px;bottom:18px;font-size:10px;color:#888}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:14px 24px}.fg .c{text-align:center;color:#8a97a8}.fg .c .img-wrap{width:100%;height:185px;display:flex;align-items:center;justify-content:center;overflow:hidden}.fg .c .img-wrap img{max-width:100%;max-height:185px;width:auto;height:auto;object-fit:contain}.fg .c div.ph-empty{height:185px;line-height:185px}
.fg .cap{color:#222;text-align:left;font-size:11.5px;margin-top:3px}
#lock{position:fixed;inset:0;background:#1a1f2e;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;gap:18px}
#lock .llogo{background:#c8222f;color:#fff;font-size:28px;font-weight:800;padding:8px 22px;border-radius:5px;letter-spacing:1px}
#lock h2{color:#fff;margin:0;font-size:20px;letter-spacing:.5px}
#lock input{width:220px;text-align:center;font-size:28px;letter-spacing:8px;padding:12px 16px;border-radius:8px;border:2px solid #3a4350;background:#222831;color:#fff;outline:none}
#lock input:focus{border-color:#c8222f}
#lock .lb{background:#c8222f;color:#fff;border:0;padding:12px 40px;border-radius:8px;font-size:16px;font-weight:700;cursor:pointer;width:220px}
#lock .lb:active{opacity:.85}
#lock .lerr{color:#ff6b6b;font-size:14px;min-height:20px}
</style></head><body>
<div id="lock">
  <div class="llogo">TURTO</div>
  <h2>Předávací protokol</h2>
  <input type="password" id="pin" placeholder="••••" maxlength="20" autocomplete="current-password">
  <button class="lb" id="unlockBtn">Odemknout</button>
  <div class="lerr" id="lerr"></div>
</div>

function getClients(){
  const map=new Map();
  CL_DB.forEach(c=>map.set(c[0].toLowerCase(),{firma:c[0],ico:c[1],adresa:c[3],contacts:[]}));
  [...J].reverse().forEach(j=>{
    if(!j.k||!j.k.firma)return;
    const key=j.k.firma.toLowerCase();
    if(!map.has(key))map.set(key,{firma:j.k.firma,ico:j.k.ico||'',adresa:j.k.adresa||'',contacts:[]});
    const entry=map.get(key);
    if(!entry.ico&&j.k.ico)entry.ico=j.k.ico;
    if(!entry.adresa&&j.k.adresa)entry.adresa=j.k.adresa;
    if(j.k.kontakt){
      const ck=j.k.kontakt.toLowerCase();
      if(!entry.contacts.find(x=>x.n.toLowerCase()===ck))
        entry.contacts.push({n:j.k.kontakt,t:j.k.tel||'',e:j.k.email||''});
    }
  });
  return [...map.values()];
}

        matAll.forEach(x=>{matJa+=(+x.q||0)*(+x.p||0)*(1-slvM);});
        prAll.forEach(x=>{
          const val=(+x.q||0)*(+x.p||0);
          const vs=x.n&&x.n.includes('DOPRAVA pracovníků montáže')?val:val*(1-slvP);

          else if(PVC_C.includes(x.s)){pvcJa+=vs*0.7;pvcT+=vs*0.3;}
          else if(INJ_C.includes(x.s)){injJa+=vs*0.5;injT+=vs*0.5;}
          else if(prAll.some(r=>INJ_C.includes(r.s))){injJa+=vs*0.5;injT+=vs*0.5;} // bez kategorie + INJ zakázka → 50/50
          else{pvcJa+=vs*0.7;pvcT+=vs*0.3;} // bez kategorie + PVC zakázka → 70/30
        });
        const o70bez=pvcJa+injJa;
        const o70dop=o70bez+dopJa+vicJa;
        const t30bez=pvcT+injT;
        const celkBez=o70bez+t30bez;
        // Validace: součet kategorií musí odpovídat celkové ceně
        const kategSoucet=pvcJa+pvcT+injJa+injT+dopJa+vicJa;
        const validErr=Math.abs(cena-kategSoucet)>1;
        const unkItems=prAll.filter(x=>x.s&&![...PVC_C,...INJ_C,'Doprava a vícenáklady','Centrála'].includes(x.s));
        const noSItems=prAll.filter(x=>{const vs=(+x.q||0)*(+x.p||0)*(1-((zak.slevaP||0)/100));return vs>0&&(!x.s||x.s==='');});
        const validTip=validErr?'Chyba: Cena='+cz(cena)+' Kč, součet kategorií='+cz(kategSoucet)+' Kč, rozdíl='+cz(Math.abs(cena-kategSoucet))+' Kč'+(unkItems.length?' | Neznámé kategorie: '+unkItems.map(x=>x.n+'('+x.s+')').join(', '):'')+(noSItems.length?' | Bez kategorie: '+noSItems.map(x=>x.n||'?').join(', '):''):'';
        sumCena+=cena;sumO70bez+=o70bez;sumO70dop+=o70dop;sumT30bez+=t30bez;sumDop+=dopJa;sumVic+=vicJa;sumCelkBez+=celkBez;sumMat+=matJa;
        const datum=zak.k&&zak.k.datum?zak.k.datum.split('-').reverse().slice(0,2).join('.'):'-';
        const hasInj=prAll.some(x=>INJ_C.includes(x.s));

        const typLabel=hasInj&&hasPvc?'PVC + INJ.':hasInj?'INJ.':'PVC';
        const zakaznik=zak.k&&zak.k.firma||'-';
        const stavba=zak.k&&zak.k.akce||zak.t||'-';
        const warnCell=validErr?'<span title="'+esc(validTip)+'" style="cursor:help;margin-left:4px;color:#e53935;font-size:16px">⚠️</span>':'';
        mesRows+='<tr data-openj="'+zak.id+'" style="border-bottom:1px solid #ccc;cursor:pointer'+(validErr?';background:#fff3f3':'')+'" title="Klikni pro otevření PDF zúčtování">'
          +'<td style="padding:3px 6px;font-weight:bold;color:'+(hasInj?'#ce93d8':'#81d4fa')+'">'+typLabel+'</td>'+'<td style="padding:3px 6px">'+datum+'</td>'
          +'<td style="padding:3px 6px">'+esc(zakaznik)+'</td>'
          +'<td style="padding:3px 6px">'+esc(stavba)+warnCell+'</td>'

          +'<td style="padding:3px 6px;text-align:right;background:#c8e6c9">'+(matJa>0?cz(matJa)+' Kč':'-')+'</td>'
          +(getRole()!=='turto'?'<td style="padding:3px 6px;text-align:right">'+(o70bez>0?cz(o70bez)+' Kč':'-')+'</td>':'')
          +(getRole()!=='turto'?'<td style="padding:3px 6px;text-align:right;background:#fff176">'+(o70dop>0?cz(o70dop)+' Kč':'-')+'</td>':'')
          +(getRole()!=='turto'?'<td style="padding:3px 6px;text-align:right">'+(t30bez>0?cz(t30bez)+' Kč':'-')+'</td>':'')
          +'<td style="padding:3px 6px;text-align:right;background:#bbdefb">'+(dopJa>0?cz(dopJa)+' Kč':'-')+'</td>'
          +'<td style="padding:3px 6px;text-align:right;background:#bbdefb">'+(vicJa>0?cz(vicJa)+' Kč':'-')+'</td>'
          +'<td style="padding:3px 6px;text-align:right">'+(celkBez>0?cz(celkBez)+' Kč':'-')+'</td>'
          +'</tr>';
        }catch(e){console.warn('row err',e)}
      });
      const fakturRow=getRole()!=='turto'
        ?'<tr><td colspan="7" style="padding:4px 6px"></td>'
          +'<td style="padding:6px;text-align:center;font-weight:bold;background:#c62828;color:#fff">K fakturaci<br>ONDRA</td>'
          +'<td colspan="4" style="padding:4px 6px;text-align:right;font-weight:bold;background:#388e3c;color:#fff">CELKEM: '+cz(sumCelkBez)+' Kč</td></tr>'
        :'';
      html+='<div style="overflow-x:auto;margin:8px 0 4px">'
        +'<table style="width:100%;border-collapse:collapse;font-size:11px;font-family:Arial,sans-serif;background:#fff;color:#111">'
        +'<thead><tr style="background:#1565c0;color:#fff;font-weight:bold">'
        +'<th style="padding:4px 6px;text-align:left">Typ</th>'+'<th style="padding:4px 6px;text-align:left">Datum</th>'
        +'<th style="padding:4px 6px;text-align:left">Zákazník</th>'
        +'<th style="padding:4px 6px;text-align:left">Stavba</th>'
        +'<th style="padding:4px 6px;text-align:right">Cena celkem</th>'
        +'<th style="padding:4px 6px;text-align:right;background:#a5d6a7;color:#111">Materiál</th>'
        +(getRole()!=='turto'?'<th style="padding:4px 6px;text-align:right">Ondra 70% bez dopravy</th>':'')
        +(getRole()!=='turto'?'<th style="padding:4px 6px;text-align:right;background:#f9a825;color:#111">Ondra 70% + doprava</th>':'')
        +(getRole()!=='turto'?'<th style="padding:4px 6px;text-align:right">TURTO 30%</th>':'')
        +'<th style="padding:4px 6px;text-align:right;background:#1976d2">Doprava</th>'
        +'<th style="padding:4px 6px;text-align:right;background:#1976d2">Vícenáklady</th>'
        +'<th style="padding:4px 6px;text-align:right">Celkem bez dopravy</th>'
        +'</tr></thead>'
        +'<tbody>'+mesRows+'</tbody>'
        +'<tfoot>'
        +'<tr style="font-weight:bold;background:#e3f2fd">'
        +'<td style="padding:4px 6px"></td>'+'<td colspan="3" style="padding:4px 6px">cena celkem</td>'
        +'<td style="padding:4px 6px;text-align:right;background:#bbdefb">'+cz(sumCena)+' Kč</td>'
        +'<td style="padding:4px 6px;text-align:right;background:#c8e6c9">'+cz(sumMat)+' Kč</td>'
        +(getRole()!=='turto'?'<td style="padding:4px 6px;text-align:right">'+cz(sumO70bez)+' Kč</td>':'')
        +(getRole()!=='turto'?'<td style="padding:4px 6px;text-align:right;background:#fff176;color:#111">'+cz(sumO70dop)+' Kč</td>':'')
        +(getRole()!=='turto'?'<td style="padding:4px 6px;text-align:right">'+cz(sumT30bez)+' Kč</td>':'')
        +'<td style="padding:4px 6px;text-align:right;background:#bbdefb">'+cz(sumDop)+' Kč</td>'
        +'<td style="padding:4px 6px;text-align:right;background:#bbdefb">'+cz(sumVic)+' Kč</td>'
        +'<td style="padding:4px 6px;text-align:right">'+cz(sumCelkBez)+' Kč</td>'
        +'</tr>'
        +fakturRow
        +'</tfoot></table></div>';
    }
    html+='</div></details>';
  });
  return html;
}

function rst(){K.forEach(e=>{if(!['montaznik','jmT'].includes(e.dataset.k))e.value=''});K.find(e=>e.dataset.k=='datum').value=new Date().toISOString().slice(0,10);K.find(e=>e.dataset.k=='zakazka').value=nextNo();syncR();K.find(e=>e.dataset.k=='informovan').dataset.man='';K.find(e=>e.dataset.k=='jmT').value='Ondřej Kasal';$('usig').checked=true;updSig();document.querySelectorAll('input[type=radio]').forEach(r=>r.checked=false);selMat={};selPrace={};custMat=[];custPrace=[];photos=[];if($('sleva-prace'))$('sleva-prace').value=0;$('pr').checked=false;$('pr2').checked=false;$('q').value='';$('fm').value='';$('fp').value='';$('res').innerHTML='';$('out').style.display='none';$('sgT').clr(true);$('sgO').clr(true);drawMat();setPraceTab(_praceTab);dph()}
async function applyJob(j,ph){
  rst();
  K.forEach(e=>{if(j.k&&j.k[e.dataset.k]!=null)e.value=j.k[e.dataset.k]});
  ['ready','done'].forEach(n=>{const r=document.querySelector(`input[name=${n}][value="${j[n]}"]`);if(r)r.checked=true});
  K.find(e=>e.dataset.k=='informovan').dataset.man=(j.k.informovan&&j.k.informovan!==j.k.firma)?'1':'';
  syncR();
  $('usig').checked=(j.k.jmT||'Ondřej Kasal').trim()=='Ondřej Kasal';updSig();
  selMat=j.selMat||{};selPrace=j.selPrace||{};dopPvc=j.dopPvc||{};dopInj=j.dopInj||{};custMat=j.custMat||[];custPrace=j.custPrace||[];
  if($('sleva-prace'))$('sleva-prace').value=j.slevaP||0;
  photos=ph||[];
  $('pr').checked=!!j.pr;$('pr2').checked=!!j.pr2;
  await $('sgT').setImg(j.sgT||'');await $('sgO').setImg(j.sgO||'');
  drawMat();setPraceTab(_praceTab);dph();
}
async function fetchPhotos(j){
  let ph=(j.photos&&j.photos.length)?j.photos:await idb.load(j.id);
  if(ph.length<(j.photoCount||0)){const cp=await sbLoadPhotos(j.id);if(cp.length>ph.length)ph=cp}
  return ph;
}
async function loadJ(j,noNav){
  await flushSave();
  loadingJob=true;
  try{
    const ph=await fetchPhotos(j);
    photosIncomplete=ph.length<(j.photoCount||0);
    if(ph.length)await idb.save(j.id,ph);
    await applyJob(j,ph);
    jid=j.id;
  }finally{loadingJob=false}
  if(photosIncomplete)jmsg('⚠ Fotky zakázky se nepodařilo načíst z cloudu – cloud neaktualizuji, ať o ně nepřijdeš');
  if(!noNav){$('jl').style.display='none';if(!photosIncomplete)jmsg('Otevřeno: '+j.t);go(0)}
}
async function withJob(j,fn){
  await flushSave();
  const keep=snapJob(),keepPh=photos,keepJid=jid,keepInc=photosIncomplete;
  loadingJob=true;
  try{
    await applyJob(j,await fetchPhotos(j));
    return await fn();
  }finally{
    await applyJob(keep,keepPh);
    jid=keepJid;photosIncomplete=keepInc;loadingJob=false;
  }
}
$('jl').onclick=async e=>{

        nm='Zuctovani-'+[datum,firma].filter(Boolean).join('-').replace(/[/\\:*?"<>|]+/g,'').slice(0,80)+'.pdf';
      }
      pdfObj.save(nm);
    }catch(er){alert('Chyba: '+er.message);}
    zuct.textContent='⬇ Zúčt.';zuct.disabled=false;
    return;
  }
  const pdf=e.target.closest('[data-pdf]');
  if(pdf){
    const j=findJ(pdf.dataset.pdf);
    if(!j)return;
    const t0=pdf.textContent;
    pdf.textContent='⏳…';pdf.disabled=true;
    try{
      const sCeny=pdf.dataset.ceny=='1';
      const pdfObj=await withJob(j,()=>buildPdf(sCeny));
      const datum=j.k&&j.k.datum?j.k.datum.split('-').reverse().join('.'):'';
      const firma=j.k&&j.k.firma||'';
      const akce=j.k&&j.k.akce||'';
      const nm=[datum,firma,akce].filter(Boolean).join(' - ').replace(/[/\\:*?"<>|]+/g,'').trim()||'Protokol';
      pdfObj.save(nm.slice(0,100)+'.pdf');
    }catch(er){alert('Chyba PDF: '+er.message);}
    pdf.textContent=t0;pdf.disabled=false;
    return;
  }
  const x=e.target.closest('[data-x]');
  if(x){
    if(x.dataset.arm!='1'){x.dataset.arm='1';x.textContent='Opravdu smazat?';return}
    try{const nJ=JS().filter(j=>j.id!=x.dataset.x);localStorage.setItem('turtoJobs',JSON.stringify(nJ));J=nJ;sbDelete(x.dataset.x);idb.del(x.dataset.x)}catch(er){}
    if(jid==x.dataset.x){jid=null;clearTimeout(svT);svT=null}

let cnSelMat={},cnSelPrace={},cnCustMat=[],cnCustPrace={},cnId=null;
cnCustMat=[];let _cnCustPrace=[];

// LocalStorage pro CN
const CN_KEY='turtoCN';
function CNs(){try{return JSON.parse(localStorage.getItem(CN_KEY)||'[]')}catch(e){return[]}}
function saveCNs(arr){try{localStorage.setItem(CN_KEY,JSON.stringify(arr))}catch(e){}}

function getCNfields(){
  return{
    firma:($('cn-firma')&&$('cn-firma').value)||'',
    ico:($('cn-ico')&&$('cn-ico').value)||'',
    akce:($('cn-akce')&&$('cn-akce').value)||'',
    jmeno:($('cn-jmeno')&&$('cn-jmeno').value)||'',
    tel:($('cn-tel')&&$('cn-tel').value)||'',
    datum:($('cn-datum')&&$('cn-datum').value)||new Date().toISOString().slice(0,10),
    platnost:($('cn-platnost')&&$('cn-platnost').value)||30,
    sleva:($('cn-sleva')&&$('cn-sleva').value)||0,
  };
}

function saveCN(){
  const f=getCNfields();
  const title=(f.firma||f.akce||'Bez názvu')+' · '+f.datum.split('-').reverse().join('.');
  const o={id:cnId||Date.now()+'',title,fields:f,selMat:cnSelMat,selPrace:cnSelPrace,custMat:cnCustMat,custPrace:_cnCustPrace,saved:new Date().toISOString()};
  cnId=o.id;
  const arr=CNs().filter(x=>x.id!==o.id);
  arr.unshift(o);
  saveCNs(arr.slice(0,50));
  return o;
}

function loadCN(o){
  cnId=o.id;
  cnSelMat=o.selMat||{};cnSelPrace=o.selPrace||{};cnCustMat=o.custMat||[];_cnCustPrace=o.custPrace||[];
  renderCN(o.fields);
}

function renderCNlist(){
  const arr=CNs();
  if(!arr.length)return'<div style="color:var(--mu);padding:12px">Žádné uložené nabídky.</div>';
  return arr.map(o=>`<div style="display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--ln)">
    <span style="flex:1;cursor:pointer;color:#8bc34a" data-cnload="${o.id}">${esc(o.title)}</span>
    <small style="color:var(--mu)">${o.saved?o.saved.slice(0,10):''}</small>
    <button class="b s" data-cndel="${o.id}" style="background:#c62828;padding:4px 8px;font-size:11px">✕</button>
  </div>`).join('');
}

function renderCN(prefill){
  const sleva=(+(prefill?prefill.sleva:($('cn-sleva')&&$('cn-sleva').value))||0)/100;
  const fFirma=prefill?prefill.firma:($('cn-firma')&&$('cn-firma').value||V('firma')||'');
  const fIco=prefill?prefill.ico:($('cn-ico')&&$('cn-ico').value||V('ico')||'');
  const fAkce=prefill?prefill.akce:($('cn-akce')&&$('cn-akce').value||V('akce')||'');
  const fJmeno=prefill?prefill.jmeno:($('cn-jmeno')&&$('cn-jmeno').value||V('kontakt')||'');
  const fTel=prefill?prefill.tel:($('cn-tel')&&$('cn-tel').value||V('tel')||'');
  const fDatum=prefill?prefill.datum:(($('cn-datum')&&$('cn-datum').value)||new Date().toISOString().slice(0,10));
  const fPlatnost=prefill?prefill.platnost:(($('cn-platnost')&&$('cn-platnost').value)||30);

  // Totals
  const tMat=[...D_mat.map((x,i)=>({...x,...(cnSelMat[i]||{})})).filter((_,i)=>cnSelMat[i]&&cnSelMat[i].on),...cnCustMat.filter(c=>c.on)].reduce((a,x)=>a+(+x.q||0)*(+x.p||0),0);
  const tPraceRaw=[...D_prace.map((x,i)=>({...x,...(cnSelPrace[i]||{})})).filter((_,i)=>cnSelPrace[i]&&cnSelPrace[i].on),..._cnCustPrace.filter(c=>c.on)].reduce((a,x)=>a+(+x.q||0)*(+x.p||0),0);
  const tPrace=tPraceRaw*(1-sleva);
  const tAll=tMat+tPrace;

  // Rows for mat
  const matRows=D_mat.map((x,i)=>{
    const s=cnSelMat[i]||{};const on=s.on||false;
    const q=s.q!=null?s.q:(x.q||1);const p=s.p!=null?s.p:(x.p||0);
    return `<div class="it ${on?'':'off'}" data-cni="${i}" data-cnt="mat">
      <input type="checkbox" class="o" ${on?'checked':''}><span><b>${esc(x.n)}</b><small>${x.s||''}</small></span>
      <input type="number" class="q" value="${q}" min="0" step="0.01"><span class="u">${x.u||'ks'}</span>
      <input type="number" class="p" value="${p}" min="0" step="1"></div>`;
  }).join('');
  const custMatRows=cnCustMat.map((x,i)=>`<div class="it ${x.on?'':'off'}" data-cni="${i}" data-cnt="custmat">
    <input type="checkbox" class="o" ${x.on?'checked':''}><input type="text" class="n" value="${esc(x.n)}" placeholder="Název">
    <input type="number" class="q" value="${x.q||1}" min="0" step="0.01"><input type="text" class="u" value="${esc(x.u||'ks')}" style="width:50px">
    <input type="number" class="p" value="${x.p||0}" min="0" step="1"></div>`).join('');
  // Rows for prace
  const praceRows=D_prace.map((x,i)=>{
    const s=cnSelPrace[i]||{};const on=s.on||false;
    const q=s.q!=null?s.q:(x.q||1);const p=s.p!=null?s.p:(x.p||0);
    return `<div class="it ${on?'':'off'}" data-cni="${i}" data-cnt="prace">
      <input type="checkbox" class="o" ${on?'checked':''}><span><b>${esc(x.n)}</b><small>${x.s||''}</small></span>
      <input type="number" class="q" value="${q}" min="0" step="0.01"><span class="u">${x.u||'ks'}</span>
      <input type="number" class="p" value="${p}" min="0" step="1"></div>`;
  }).join('');
  const custPraceRows=_cnCustPrace.map((x,i)=>`<div class="it ${x.on?'':'off'}" data-cni="${i}" data-cnt="custprace">
    <input type="checkbox" class="o" ${x.on?'checked':''}><input type="text" class="n" value="${esc(x.n)}" placeholder="Název">
    <input type="number" class="q" value="${x.q||1}" min="0" step="0.01"><input type="text" class="u" value="${esc(x.u||'ks')}" style="width:50px">
    <input type="number" class="p" value="${x.p||0}" min="0" step="1"></div>`).join('');

  $('cn-panel').innerHTML=`
  <div style="background:var(--bg2);border:1px solid var(--ln);border-radius:8px;padding:16px;margin-bottom:16px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px">
      <b style="font-size:16px;color:#8bc34a">📋 Cenová nabídka</b>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="b" id="cn-save-btn" style="background:#1b5e20;padding:6px 14px">💾 Uložit nabídku</button>
        <button class="b s" id="cn-list-btn" style="padding:6px 14px">📂 Uložené nabídky</button>
        <button class="b s" id="cn-new-btn" style="padding:6px 14px;background:#333">+ Nová</button>
        <button class="b s" id="cn-close" style="background:#555">✕ Zavřít</button>
      </div>
    </div>

    <!-- Uložené nabídky -->
    <div id="cn-list-panel" style="display:none;background:var(--bg);border:1px solid var(--ln);border-radius:6px;padding:12px;margin-bottom:12px">
      <b style="color:var(--mu);font-size:12px">ULOŽENÉ NABÍDKY</b>
      <div id="cn-list-rows" style="margin-top:8px">${renderCNlist()}</div>
    </div>

    <!-- Firma vyhledávání -->
    <div style="margin-bottom:16px">
      <label style="color:var(--mu);font-size:12px">Vyhledat zákazníka</label>
      <input id="cn-search" type="text" placeholder="Zadejte název firmy..." value="${esc(fFirma)}"
        style="width:100%;padding:8px;border:1px solid var(--ln);border-radius:4px;background:var(--bg);color:var(--fg);margin-top:4px">
      <div id="cn-search-res" style="background:var(--bg2);border:1px solid var(--ln);border-radius:4px;margin-top:2px;display:none;max-height:180px;overflow-y:auto"></div>
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px">
      <div><label style="color:var(--mu);font-size:12px">Zákazník / firma</label>
        <input id="cn-firma" data-cnk="firma" type="text" value="${esc(fFirma)}" placeholder="Název firmy"
          style="width:100%;padding:8px;border:1px solid var(--ln);border-radius:4px;background:var(--bg);color:var(--fg)"></div>
      <div><label style="color:var(--mu);font-size:12px">IČ</label>
        <input id="cn-ico" data-cnk="ico" type="text" value="${esc(fIco)}" placeholder="IČ"
          style="width:100%;padding:8px;border:1px solid var(--ln);border-radius:4px;background:var(--bg);color:var(--fg)"></div>
      <div style="grid-column:1/-1"><label style="color:var(--mu);font-size:12px">Stavba / akce</label>
        <input id="cn-akce" data-cnk="akce" type="text" value="${esc(fAkce)}" placeholder="Popis stavby"
          style="width:100%;padding:8px;border:1px solid var(--ln);border-radius:4px;background:var(--bg);color:var(--fg)"></div>
      <div><label style="color:var(--mu);font-size:12px">Kontaktní osoba</label>
        <input id="cn-jmeno" data-cnk="jmeno" type="text" value="${esc(fJmeno)}" placeholder="Jméno a příjmení"
          style="width:100%;padding:8px;border:1px solid var(--ln);border-radius:4px;background:var(--bg);color:var(--fg)"></div>
      <div><label style="color:var(--mu);font-size:12px">Telefon</label>
        <input id="cn-tel" data-cnk="tel" type="tel" value="${esc(fTel)}" placeholder="+420 ..."
          style="width:100%;padding:8px;border:1px solid var(--ln);border-radius:4px;background:var(--bg);color:var(--fg)"></div>
      <div><label style="color:var(--mu);font-size:12px">Datum nabídky</label>
        <input id="cn-datum" data-cnk="datum" type="date" value="${fDatum}"
          style="width:100%;padding:8px;border:1px solid var(--ln);border-radius:4px;background:var(--bg);color:var(--fg)"></div>
      <div><label style="color:var(--mu);font-size:12px">Platnost nabídky (dní)</label>
        <input id="cn-platnost" data-cnk="platnost" type="number" value="${fPlatnost}" min="1"
          style="width:100%;padding:8px;border:1px solid var(--ln);border-radius:4px;background:var(--bg);color:var(--fg)"></div>
    </div>

    <h3 style="color:#81d4fa;margin:12px 0 6px">Materiál</h3>
    <div id="cn-items-mat" style="margin-bottom:8px">${matRows}${custMatRows}</div>
    <button class="b s" id="cn-add-mat" style="font-size:12px;padding:6px 12px;background:#1565c0">+ Vlastní položka materiálu</button>

    <h3 style="color:#a5d6a7;margin:16px 0 6px">Práce</h3>
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:8px;flex-wrap:wrap">
      <label style="color:var(--mu);font-size:12px">Sleva na práce:
        <input id="cn-sleva" type="number" value="${Math.round(sleva*100)}" min="0" max="100" step="1"
          style="width:60px;padding:4px;border:1px solid var(--ln);border-radius:4px;background:var(--bg);color:var(--fg)"> %</label>
    </div>
    <div id="cn-items-prace" style="margin-bottom:8px">${praceRows}${custPraceRows}</div>
    <button class="b s" id="cn-add-prace" style="font-size:12px;padding:6px 12px;background:#2e7d32">+ Vlastní položka práce</button>

    <div style="margin-top:16px;padding:12px;background:var(--bg2);border-radius:6px;border:1px solid var(--ln)">
      ${tMat>0?`<div style="color:#81d4fa">Materiál celkem: <b>${cz(tMat)} Kč</b></div>`:''}
      ${tPrace>0?`<div style="color:#a5d6a7">Práce celkem${sleva>0?' (po slevě '+Math.round(sleva*100)+'%)':''}:<b> ${cz(tPrace)} Kč</b></div>`:''}
      ${sleva>0&&tPrace>0?`<div style="color:#ffd54f;font-size:12px">Práce bez slevy: ${cz(tPraceRaw)} Kč · Sleva: ${cz(tPraceRaw-tPrace)} Kč</div>`:''}
      ${tAll>0?`<div style="font-size:18px;font-weight:bold;margin-top:8px;border-top:1px solid var(--ln);padding-top:8px">CELKEM bez DPH: ${cz(tAll)} Kč</div>`:''}
      ${tAll>0?`<div style="color:var(--mu);font-size:12px">Cena včetně DPH 21%: ${cz(Math.round(tAll*1.21))} Kč</div>`:''}
    </div>
    <div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap">
      <button class="b" id="cn-pdf" style="background:#1b5e20">⬇ Stáhnout PDF nabídky</button>
    </div>
  </div>`;

  // Events
  $('cn-close').onclick=()=>{$('cn-panel').style.display='none'};
  $('cn-new-btn').onclick=()=>{cnId=null;cnSelMat={};cnSelPrace={};cnCustMat=[];_cnCustPrace=[];renderCN()};
  $('cn-save-btn').onclick=()=>{saveCN();jmsg('Nabídka uložena ✓');renderCN();};
  $('cn-list-btn').onclick=()=>{
    const lp=$('cn-list-panel');
    lp.style.display=lp.style.display==='none'?'block':'none';
    $('cn-list-rows').innerHTML=renderCNlist();
  };
  $('cn-list-rows').onclick=e=>{
    const load=e.target.closest('[data-cnload]');
    const del=e.target.closest('[data-cndel]');
    if(load){const o=CNs().find(x=>x.id===load.dataset.cnload);if(o)loadCN(o);}
    if(del){if(confirm('Smazat nabídku?')){saveCNs(CNs().filter(x=>x.id!==del.dataset.cndel));$('cn-list-rows').innerHTML=renderCNlist();}}
  };

  // Firma search
  const searchEl=$('cn-search');const resEl=$('cn-search-res');
  function doSearch(q){
    if(!q||q.length<2){resEl.style.display='none';return;}
    const ql=q.toLowerCase();
    const hits=CL_DB.filter(r=>r[0].toLowerCase().includes(ql)).slice(0,12);
    if(!hits.length){resEl.style.display='none';return;}
    resEl.innerHTML=hits.map(r=>`<div style="padding:8px 10px;cursor:pointer;border-bottom:1px solid var(--ln)" data-cf="${esc(r[0])}" data-ci="${esc(r[1])}">${esc(r[0])}<small style="color:var(--mu);margin-left:8px">${r[1]?'IČ '+r[1]:''}</small></div>`).join('');
    resEl.style.display='block';
  }
  searchEl.oninput=()=>doSearch(searchEl.value);
  resEl.onclick=e=>{
    const row=e.target.closest('[data-cf]');if(!row)return;
    $('cn-firma').value=row.dataset.cf;
    $('cn-ico').value=row.dataset.ci||'';
    searchEl.value=row.dataset.cf;
    resEl.style.display='none';
  };
  document.addEventListener('click',e=>{if(!resEl.contains(e.target)&&e.target!==searchEl)resEl.style.display='none';},{once:false,capture:false});

  $('cn-add-mat').onclick=()=>{cnCustMat.push({n:'',u:'ks',q:1,p:0,on:true});renderCN()};
  $('cn-add-prace').onclick=()=>{_cnCustPrace.push({n:'',u:'ks',q:1,p:0,on:true});renderCN()};
  $('cn-sleva').oninput=()=>renderCN();

  $('cn-items-mat').addEventListener('change',e=>{
    const it=e.target.closest('[data-cni]');if(!it)return;
    const i=+it.dataset.cni,t=it.dataset.cnt,v=e.target;
    if(t==='mat'){const s=cnSelMat[i]=cnSelMat[i]||{q:+D_mat[i].q||1,p:+D_mat[i].p||0};
      if(v.classList.contains('o'))s.on=v.checked;
      else if(v.classList.contains('q'))s.q=+v.value;
      else if(v.classList.contains('p'))s.p=+v.value;
    }else{const x=cnCustMat[i];
      if(v.classList.contains('o'))x.on=v.checked;else if(v.classList.contains('q'))x.q=+v.value;
      else if(v.classList.contains('p'))x.p=+v.value;else if(v.classList.contains('n'))x.n=v.value;
      else if(v.classList.contains('u'))x.u=v.value;
    }
    renderCN();
  });
  $('cn-items-prace').addEventListener('change',e=>{
    const it=e.target.closest('[data-cni]');if(!it)return;
    const i=+it.dataset.cni,t=it.dataset.cnt,v=e.target;
    if(t==='prace'){const s=cnSelPrace[i]=cnSelPrace[i]||{q:+D_prace[i].q||1,p:+D_prace[i].p||0};
      if(v.classList.contains('o'))s.on=v.checked;
      else if(v.classList.contains('q'))s.q=+v.value;
      else if(v.classList.contains('p'))s.p=+v.value;
    }else{const x=_cnCustPrace[i];
      if(v.classList.contains('o'))x.on=v.checked;else if(v.classList.contains('q'))x.q=+v.value;
      else if(v.classList.contains('p'))x.p=+v.value;else if(v.classList.contains('n'))x.n=v.value;
      else if(v.classList.contains('u'))x.u=v.value;
    }
    renderCN();
  });

  $('cn-pdf').onclick=async()=>{
    const btn=$('cn-pdf');btn.disabled=true;btn.textContent='⏳ Generuji…';
    try{await buildCNpdf();}catch(e){alert('Chyba: '+e.message);}
    btn.disabled=false;btn.textContent='⬇ Stáhnout PDF nabídky';
  };
}

  if(p.style.display==='block'){p.style.display='none';return;}

  renderCN();
};

function buildZuctovaniHtml(j){

  const INJ_C=['Injektáže'];
  let cena=0,pvcJa=0,pvcT=0,injJa=0,injT=0,dopJa=0,vicJa=0,matJa=0;
  prAll.forEach(x=>{
    const val=(+x.q||0)*(+x.p||0);
    const vs=x.n&&x.n.includes('DOPRAVA pracovníků montáže')?val:val*(1-slvP);

      <tbody>
        <tr style="border-bottom:1px solid #ccc">
          <td style="padding:4px 6px">${esc(firma||akce||'Zakázka')}</td>
          <td style="padding:4px 6px;text-align:right;background:#bbdefb">${cz(cena)} Kč</td>

async function buildPdf(withPrices){
  const sg=['sgT','sgO'].map(i=>$(i).sig());
  if(mySig()&&$('usig').checked)sg[0]=mySig();
  commit();
  const P=pages(sg,withPrices),st=$('stage');
  st.innerHTML=P.join('');
  const els=[...st.children];
  els.forEach((e,i)=>e.querySelector('.pn').textContent='Strana '+(i+1)+' / '+els.length);
  const pdf=new jspdf.jsPDF({unit:'mm',format:'a4'});
  for(let i=0;i<els.length;i++){
    const c=await html2canvas(els[i],{scale:3,backgroundColor:'#fff',useCORS:true,allowTaint:true,imageTimeout:15000,logging:false});
    if(i)pdf.addPage();
    pdf.addImage(c.toDataURL('image/jpeg',1.0),'JPEG',0,0,210,297);
  }

  st.innerHTML='';
  return pdf;
}

async function buildZuctovani(j){
  const div=document.createElement('div');
  div.style.cssText='position:absolute;left:-9999px;top:0';
  div.innerHTML=buildZuctovaniHtml(j);
  document.body.appendChild(div);
  const pdf=new jspdf.jsPDF({unit:'mm',format:'a4'});
  const c=await html2canvas(div,{scale:3,backgroundColor:'#fff',useCORS:true,logging:false});
  pdf.addImage(c.toDataURL('image/jpeg',1.0),'JPEG',0,0,210,297);
  document.body.removeChild(div);
  return pdf;
}

async function uploadPdfToSupabase(pdfBlob, fileName) {
  const res = await fetch(`${SUPA_URL}/storage/v1/object/protokoly/${fileName}`, {
    method: 'POST',
    headers: {
      'Authorization': `Bearer ${SUPA_KEY}`,
      'Content-Type': 'application/pdf',
      'x-upsert': 'true'
    },
    body: pdfBlob
  });
  if (!res.ok) {
    const err = await res.text();
    throw new Error('Supabase upload error: ' + err);
  }
  return `${SUPA_URL}/storage/v1/object/public/protokoly/${fileName}`;
}
